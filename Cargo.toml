[package]
name = "bifrost-ghost-browser"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "BIFROST — The Reticulum Ghost Browser (bifrost:// & ironpass://). Zero-IP Sovereign Browser & Ed25519 EU ESPR / GS1 EPCIS 2.0 Ledger Verifier."
repository = "https://github.com/whattio/bifrost"
homepage = "https://citadel.ironpass.tech/"
keywords = ["reticulum", "zero-ip", "browser", "dpp", "epcis"]
categories = ["network-programming", "cryptography", "gui"]

[[bin]]
name = "bifrost-ghost-browser"
path = "src/main.rs"

[dependencies]
citadel-rns-rs = { git = "https://github.com/whattio/citadel-rns-rs.git", branch = "main" }
tao = "0.30"
wry = { version = "0.47", features = ["linux-body"] }
tokio = { version = "1.40", features = ["full"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
ed25519-dalek = "2.1"
sha2 = "0.10"
qrcode = "0.14"
